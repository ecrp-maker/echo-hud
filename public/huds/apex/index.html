<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>ECHO · APEX</title>
  <link rel="stylesheet" href="/huds/apex/hud.css" />
</head>
<body data-hud="apex" class="off">
  <div id="stage">
    <header class="top">
      <div class="wing ct">
        <i class="winfill"></i>
        <i class="stripe"></i>
        <span class="logo">
          <img id="ctLogo" alt="" hidden />
          <span id="ctBadge" class="badge">C</span>
        </span>
        <span id="ctBarName" class="bar-name"></span>
        <div id="ctScore" class="num">0</div>
      </div>
      <div class="board">
        <div id="round" class="round">ROUND 0 / 24</div>
        <div id="timer" class="timer">0:00</div>
      </div>
      <div class="wing t">
        <i class="winfill"></i>
        <div id="tScore" class="num">0</div>
        <span id="tBarName" class="bar-name"></span>
        <span class="logo">
          <img id="tLogo" alt="" hidden />
          <span id="tBadge" class="badge">T</span>
        </span>
        <i class="stripe"></i>
      </div>
    </header>
    <div id="bombplate" class="bombplate" hidden>
      <img src="/huds/icons/c4.svg" alt="" />
      <b id="bombTime">0:40</b>
    </div>
    <div id="defuse" class="defuse" hidden>
      <b id="defuseTime">5.0</b>
    </div>
    <div id="roundwon" class="roundwon" hidden>
      <div class="roundwon-head">
        <span class="logo">
          <img id="roundWonLogo" alt="" hidden />
          <span id="roundWonBadge" class="badge">T</span>
        </span>
        <div class="roundwon-copy">
          <b id="roundWonName" class="won-name"></b>
          <span class="won-tag">ROUND WON</span>
        </div>
      </div>
      <div id="roundMvp" class="round-mvp" hidden>
        <span class="mvp-kicker">MVP</span>
        <b id="roundMvpName"></b>
        <div class="mvp-box">
          <span><b id="mvpKills">0</b><i>KILL</i></span>
          <span><b id="mvpKd">0.00</b><i>KD</i></span>
          <span><b id="mvpHs">0%</b><i>HS</i></span>
        </div>
      </div>
    </div>

    <p id="liveCopy" class="spot-copy live-copy" hidden></p>
    <p id="pauseCopy" class="spot-copy pause-copy" hidden></p>

    <aside id="brand" class="brand" hidden>
      <video id="brandVideo" muted loop autoplay playsinline></video>
      <img id="brandImg" alt="" />
      <canvas id="brandCut" hidden></canvas>
    </aside>

    <aside class="radar">
      <div id="mapbar" class="mapbar" hidden></div>
      <div id="plot" class="plot">
        <img id="radarImg" alt="" />
      </div>
      <div id="mapcaption" class="mapcaption" hidden></div>
    </aside>

    <section id="ct" class="side ct"></section>
    <section id="t" class="side t"></section>

    <footer id="focus" class="focus" hidden>
      <span class="focus-mark">
        <img id="focusLogo" alt="" hidden />
        <span id="focusBadge" class="focus-badge">C</span>
      </span>
      <div class="focus-copy">
        <div id="focusName" class="focus-name"></div>
        <div class="focus-kd">
          <span><b id="focusK">0</b><i>K</i></span>
          <span><b id="focusA">0</b><i>A</i></span>
          <span><b id="focusD">0</b><i>D</i></span>
          <span><b id="focusRate">0.00</b><i>KD</i></span>
        </div>
      </div>
      <span id="focusUtils" class="focus-utils"></span>
      <img id="focusGun" class="focus-gun" alt="" hidden />
      <span class="focus-track"><i id="focusFill"><b id="focusHp" class="focus-hp">100</b></i></span>
    </footer>

    <div id="sting" class="sting" hidden>
      <div class="sting-bar ct"><b id="stingCt">CT</b></div>
      <div class="sting-mid">
        <img src="/logo.png" alt="" />
        <b id="stingMode">PAUSED</b>
        <span id="stingScore">0 - 0</span>
      </div>
      <div class="sting-bar t"><b id="stingT">T</b></div>
    </div>

    <section id="half" class="sb" hidden>
      <iframe class="sb-widget" title="ESEA" src="https://www.faceitcreators.com/widget?creator=ECRP" loading="lazy" referrerpolicy="no-referrer"></iframe>
      <div class="sb-title">SCOREBOARD</div>
      <div id="sbMode" class="sb-mode">HALF TIME</div>
      <div id="sbMaps" class="sb-maps" hidden></div>
      <div class="sb-main">
        <div class="sb-side ct">
          <div class="sb-cols"><span></span><span>RATING</span><span>KILLS</span></div>
          <div id="sbCtRows"></div>
        </div>
        <div id="sbScore" class="sb-score">0 - 0</div>
        <div class="sb-side t">
          <div class="sb-cols"><span>RATING</span><span>KILLS</span><span></span></div>
          <div id="sbTRows"></div>
        </div>
      </div>
      <div class="sb-brand-gap"></div>
      <div class="sb-foot">
        <div class="sb-club ct">
          <img id="halfCtLogo" alt="" hidden />
          <span id="halfCtBadge" class="sb-badge">C</span>
          <b id="halfCtName"></b>
        </div>
        <div class="sb-club t">
          <b id="halfTName"></b>
          <img id="halfTLogo" alt="" hidden />
          <span id="halfTBadge" class="sb-badge">T</span>
        </div>
      </div>
    </section>
  </div>
  <div id="wait">CS2 bekleniyor</div>
  <script src="/shared/live.js"></script>
  <script src="/huds/apex/hud.js"></script>
</body>
</html>
