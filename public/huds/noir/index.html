<!DOCTYPE html>
<html lang="tr">
<head>

  <title>ECHO · NOIR</title>
  <link rel="stylesheet" href="/huds/noir/hud.css" />
</head>
<body data-hud="noir" class="off">
  <div id="stage">
    <section id="ct" class="roster ct"></section>
    <section id="t" class="roster t"></section>
    <div class="center">
      <div id="title" class="title"></div>
      <div class="scores">
        <div id="ctScore" class="big">0</div>
        <div class="rule"></div>
        <div id="tScore" class="big">0</div>
      </div>
      <div class="teams">
        <span id="ctName">CT</span>
        <span id="round">R 0</span>
        <span id="tName">T</span>
      </div>
      <div id="timer" class="timer"></div>
      <div id="meta" class="meta"></div>
    </div>
  </div>
  <div id="wait">CS2 bekleniyor</div>
  <script src="/shared/live.js"></script>
  <script src="/huds/noir/hud.js"></script>
</body>
</html>
